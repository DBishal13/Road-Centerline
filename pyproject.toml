[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "road-centerline"
version = "0.2.0"
description = "CRS-aware road centerline extraction from polygon geometries, worldwide."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Bishal Dhungana" }]
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "pygeoops>=0.4",
    "numpy>=1.24",
    "pyproj>=3.5",
    "pyogrio>=0.7",
    "click>=8.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/DBishal13/Road-Centerline"
Documentation = "https://dbishal13.github.io/Road-Centerline/"
Changelog = "https://github.com/DBishal13/Road-Centerline/blob/main/CHANGELOG.md"

[project.scripts]
road-centerline = "road_centerline.cli:main"

[project.optional-dependencies]
network = ["networkx>=3.0"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "networkx>=3.0",
    "build>=1.2",
    "twine>=5.0",
    "matplotlib>=3.8",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/road_centerline"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
